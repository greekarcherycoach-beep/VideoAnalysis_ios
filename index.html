<!DOCTYPE html>
<html lang="el">

<script src="native-bridge.js"></script>
<script>/*h2a-fullscreen*/
(function(){
  var C=window.Capacitor;
  if(!C||!C.isNativePlatform||!C.isNativePlatform())return;
  var fs=null;
  function P(){return C.Plugins&&C.Plugins.Immersive}
  function fire(){
    document.dispatchEvent(new Event('fullscreenchange'));
    document.dispatchEvent(new Event('webkitfullscreenchange'));
  }
  function enter(el){
    var p=P(); if(!p)return Promise.reject(new TypeError('Fullscreen is not available'));
    return p.enter().then(function(){fs=el||document.documentElement;fire()});
  }
  function leave(){
    var p=P(); if(!p)return Promise.resolve();
    return p.exit().then(function(){fs=null;fire()});
  }
  Element.prototype.requestFullscreen=function(){return enter(this)};
  Element.prototype.webkitRequestFullscreen=Element.prototype.requestFullscreen;
  Document.prototype.exitFullscreen=leave;
  Document.prototype.webkitExitFullscreen=leave;
  ['fullscreenElement','webkitFullscreenElement'].forEach(function(n){
    try{Object.defineProperty(Document.prototype,n,{configurable:true,get:function(){return fs}})}catch(e){}
  });
  try{Object.defineProperty(Document.prototype,'fullscreenEnabled',{configurable:true,get:function(){return true}})}catch(e){}
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">

<title>Ανάλυση Τεχνικής</title>
<style>
:root{--acc:#ffb300;--bg:#111;--bar:#1c1c1c;--txt:#eee;--wh:112px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--txt);font-family:system-ui,-apple-system,Roboto,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{width:24px;height:24px;display:block}
[hidden]{display:none!important}

/* ---------- Αρχική ---------- */
#home{position:fixed;inset:0;overflow-y:auto;background:#0a0d11;display:flex;justify-content:center}
#home .bgfx{position:fixed;inset:0;background:radial-gradient(60% 45% at 88% 0%,#ffb30030,transparent 70%),radial-gradient(55% 40% at 0% 100%,#2b6cff30,transparent 70%),linear-gradient(#0a0d11,#10151c)}
#home .bgfx::after{content:'';position:absolute;inset:0;background-image:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:44px 44px;-webkit-mask:radial-gradient(circle at 50% 35%,#000,transparent 75%);mask:radial-gradient(circle at 50% 35%,#000,transparent 75%)}
.hwrap{position:relative;justify-content:flex-start;width:min(100%,520px);margin:0 auto;min-height:100%;padding:max(36px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;animation:rise .7s ease both}
.brand{margin:0;font-size:clamp(34px,9vw,52px);font-weight:800;letter-spacing:1px;line-height:1;background:linear-gradient(90deg,#ffcc33,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent}
.tech{font-size:clamp(18px,4.6vw,24px);font-weight:600;letter-spacing:.5px;opacity:.92;margin-top:18px}
.logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#ffcc33,#ff7a00);display:grid;place-items:center;color:#1a1000;box-shadow:0 10px 30px #ff8a0055,inset 0 1px 0 #fff6}
.logo svg{width:42px;height:42px}
#home h1{margin:4px 0 0;font-size:clamp(28px,7vw,40px);letter-spacing:-.5px;line-height:1.05;font-weight:800}
#home h1 span{background:linear-gradient(90deg,#ffcc33,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0;opacity:.72;line-height:1.5;font-size:15px;max-width:380px}
.hero{width:min(100%,360px);filter:drop-shadow(0 14px 30px #0008)}
.hero svg{width:100%;height:auto}
.cards{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:4px}
.hcard{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:#ffffff0d;border:1px solid #ffffff1c;text-align:left;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .15s}
.hcard:active{transform:scale(.98)}
.hcard .hi{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:#ffffff14;color:#ffb300;flex:none}
.hcard .hi svg{width:28px;height:28px}
.hcard .ht{flex:1;display:flex;flex-direction:column;gap:3px}
.hcard b{font-size:18px}.hcard small{opacity:.65;font-size:12.5px;line-height:1.35}
.hcard .chev{opacity:.5}
.hcard.pri{background:linear-gradient(135deg,#ffc933,#ff8a00);color:#1a1000;border-color:#ffd27a;box-shadow:0 10px 30px #ff8a0040}
.hcard.pri .hi{background:#00000022;color:#1a1000}.hcard.pri small,.hcard.pri .chev{opacity:.75}
.chips{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips li{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:#ffffff0d;border:1px solid #ffffff17;font-size:12.5px}
.chips svg{width:16px;height:16px;color:#ffb300}
.foot{margin:2px 0 0;font-size:12px;opacity:.5;line-height:1.5;max-width:380px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes arc{0%{stroke-dashoffset:60}45%,100%{stroke-dashoffset:0}}
@keyframes head{0%,100%{transform:translateX(-46px)}50%{transform:translateX(46px)}}
.hero .arc{stroke-dasharray:60;animation:arc 3.6s ease-in-out infinite}
.hero .ph{animation:head 5s ease-in-out infinite}
@media (min-width:760px) and (orientation:landscape){.hwrap{width:min(100%,880px)}.cards{flex-direction:row}.hcard{flex:1}}
@media (max-height:560px) and (orientation:landscape){.hero{display:none}}
.big{width:min(86vw,360px);display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:16px;background:#2b2b2b;font-size:18px;font-weight:600}
.big svg{width:34px;height:34px;color:var(--acc)}
.big small{display:block;font-weight:400;opacity:.65;font-size:12px;margin-top:2px}
.big.pri{background:var(--acc);color:#000}.big.pri svg{color:#000}

/* ---------- Εφαρμογή ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.top{height:52px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px;padding-top:env(safe-area-inset-top);background:var(--bar)}
.top .title{flex:1;font-weight:600;padding-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.ib.acc{color:var(--acc)}
.backbtn{width:auto;height:38px;display:flex;align-items:center;gap:6px;padding:0 14px 0 10px;font-weight:700;font-size:16px;background:var(--acc);color:#000;border-radius:10px;margin-left:4px}
.backbtn svg{width:24px;height:24px}
#ttl{visibility:hidden}
.abbtn{display:flex;border:2px solid #fff;border-radius:6px;height:36px;margin:0 6px;overflow:hidden;font-size:18px}
.abbtn button{width:36px;display:grid;place-items:center;font-weight:700;background:#3a3a3a;color:#8a8a8a;transition:background .15s,color .15s}
.abbtn button+button{border-left:2px solid #fff}
.abbtn button.on{background:var(--acc);color:#000}
.abbtn.shake{animation:shk .25s}
@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.main{flex:1;display:flex;flex-direction:column;min-height:0}
.stagewrap{flex:1;position:relative;min-height:0}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;gap:2px;background:#222}
.panel{flex:1;position:relative;min-height:0;min-width:0;overflow:hidden;background:#000}
.panel video{position:absolute;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
.panel canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.stage.cmp .panel.act{outline:2px solid var(--acc);outline-offset:-2px}
.tag{position:absolute;left:8px;top:8px;background:#000a;border-radius:6px;padding:2px 8px;font-weight:700;pointer-events:none}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#151515}
.empty .big{width:min(84%,260px);padding:10px 12px;font-size:14px;gap:8px;justify-content:center}.empty .big svg{width:22px;height:22px;flex:none}.empty .big small{display:none}
@media (orientation:landscape){.stage.cmp:not(.lcol){flex-direction:row}}
.stage.cmp.lrow{flex-direction:row}

/* Εργαλειοθήκη */
.tb{position:absolute;right:6px;top:6px;max-height:calc(100% - 12px);width:50px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;scrollbar-width:none;background:rgba(18,18,18,.78);border-radius:14px;padding:4px;z-index:5}
.tb::-webkit-scrollbar{display:none}
.tbtn{width:42px;height:42px;flex:none;border-radius:10px;display:grid;place-items:center;font-size:11px}
.tbtn.on{background:var(--acc);color:#000}
.tbtn .sw{width:26px;height:26px;border-radius:6px;border:2px solid #fff}
.tbtn.lbl{font-size:10px;font-weight:700;letter-spacing:.3px}
.sep{height:1px;background:#444;margin:2px 4px;flex:none}
.pop{position:absolute;right:64px;top:8px;width:240px;background:#262626;border-radius:14px;padding:12px;z-index:6;box-shadow:0 6px 24px #000a}
.pop label{display:block;font-size:12px;opacity:.75;margin:10px 0 2px}
.pop input[type=range]{width:100%;accent-color:var(--acc)}
.pop select{width:100%;padding:8px;border-radius:8px;background:#333;color:#fff;border:0}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sws button{width:34px;height:34px;border-radius:50%;border:3px solid #444}
.sws button.on{border-color:#fff}
.sws input{width:34px;height:34px;border:0;padding:0;background:none}

/* Πάνελ ελέγχου */
.dock{--ds:1;position:relative;flex:none;background:var(--bar);padding:5px 12px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:4px;border-top:1px solid #333}
.tl{display:flex;align-items:center;gap:10px}
.tl input[type=range]{flex:1;accent-color:var(--acc);height:20px;min-width:0;margin:0}
.tl .tm{font-variant-numeric:tabular-nums;font-size:13px;text-align:right;min-width:92px;line-height:1.15}
.tl .tm small{display:block;opacity:.6;font-size:11px}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:8px}
.col{display:flex;flex-direction:column;gap:8px;align-items:center}
.row{display:flex;gap:8px}
.cb{width:calc(54px*var(--ds));height:calc(38px*var(--ds));border-radius:12px;background:#2c2c2c;display:grid;place-items:center}
.cb.play{width:calc(68px*var(--ds));height:calc(44px*var(--ds));color:var(--acc);border-radius:14px;background:#2c2c2c}
.dgrip{height:14px;margin:-5px -12px -3px;display:grid;place-items:center;touch-action:none;cursor:ns-resize;flex:none}
.dgrip i{display:block;width:54px;height:6px;border-radius:4px;background:#666}
.dgrip:active i{background:var(--acc)}
.cb.on{background:var(--acc);color:#000}
.cb svg{width:calc(24px*var(--ds));height:calc(24px*var(--ds))}
.spd{font-weight:800;font-size:calc(20px*var(--ds));color:var(--acc)}
.ruler{position:relative;height:calc(60px*var(--ds));border-radius:12px;background:#0d0d0d;touch-action:none;overflow:hidden;box-shadow:inset 0 0 0 1px #333;cursor:ew-resize}
.ruler canvas{position:absolute;inset:0;width:100%;height:100%}
.ruler::before,.ruler::after{content:'';position:absolute;top:0;bottom:0;width:48px;z-index:1;pointer-events:none}
.ruler::before{left:0;background:linear-gradient(90deg,#0d0d0d,transparent)}
.ruler::after{right:0;background:linear-gradient(270deg,#0d0d0d,transparent)}
.ctl{flex-wrap:nowrap;justify-content:center!important;gap:6px}
.ctl .cb{width:auto;flex:1 1 0;min-width:0;max-width:96px}
.ctl .cb.play{flex:1.3 1 0;max-width:130px}
.stage:not(.cmp) .tag{display:none}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;margin:8px 0}
.vi{position:relative;background:#333;border-radius:12px;overflow:hidden;text-align:left;display:block;width:100%}
.vi img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#111}
.vi .vm{padding:6px 8px 8px;font-size:11.5px;opacity:.85}.vi .vm b{display:block;font-size:13px;opacity:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vi .x{position:absolute;right:4px;top:4px;width:30px;height:30px;border-radius:50%;background:#000b;display:grid;place-items:center}
.vi .x svg{width:16px;height:16px}
.vwrap{position:relative}
body.fs .top{display:none}
#fsb{position:fixed;left:8px;top:calc(8px + env(safe-area-inset-top));z-index:30;width:44px;height:44px;border-radius:12px;background:#000a;display:none;place-items:center}
body.fs #fsb{display:grid}
.split{flex:none;position:relative;z-index:4;touch-action:none;background:#1c1c1c;display:grid;place-items:center;height:26px;cursor:ns-resize}
.split i{display:block;width:64px;height:8px;border-radius:5px;background:var(--acc);box-shadow:0 0 0 3px #000a}
.stage.row .split{height:auto;width:26px;cursor:ew-resize}
.stage.row .split i{width:8px;height:64px}
.scr{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:8px 0;border-radius:12px;background:#2e2e2e}
.scr .scrn{flex:1;min-width:0;display:flex;flex-direction:column}
.scr b{font-size:20px}.scr small{opacity:.6;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{padding:9px 14px;border-radius:10px;background:#444;font-size:14px}
.mini.pri{background:var(--acc);color:#000;font-weight:700}
.mini[disabled]{opacity:.35}
@media (max-width:400px){.cb{width:calc(48px*var(--ds));height:calc(36px*var(--ds))}.cb.play{width:calc(60px*var(--ds));height:calc(42px*var(--ds))}}
@media (orientation:landscape) and (max-height:640px){
 :root{--wh:92px}
 .main{flex-direction:row}
 .dock{width:270px;border-top:0;border-left:1px solid #333;justify-content:center;overflow-y:auto}
 .cb{width:calc(48px*var(--ds));height:calc(36px*var(--ds))}.cb.play{width:calc(58px*var(--ds));height:calc(40px*var(--ds))}
}

/* Modal */
#modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:50;padding:12px}
.card{background:#242424;border-radius:18px;padding:16px;width:min(94vw,440px);max-height:92vh;overflow:auto}
.card h3{margin:0 0 8px}
.mb{display:block;width:100%;padding:14px;margin:8px 0;border-radius:12px;background:#343434;text-align:left;font-size:16px}
.mb small{display:block;opacity:.65;font-size:12px;margin-top:3px;font-weight:400}
.mb.pri{background:var(--acc);color:#000;font-weight:600}
.inp{width:100%;padding:12px;border-radius:10px;border:0;background:#333;color:#fff;font-size:18px}
.seg{display:flex;gap:6px;margin:6px 0}.seg button{flex:1;padding:10px;border-radius:10px;background:#343434}.seg button.on{background:var(--acc);color:#000;font-weight:700}
.bar{height:10px;background:#444;border-radius:5px;overflow:hidden;margin:14px 0}.bar i{display:block;height:100%;width:0;background:var(--acc)}
.card select{padding:6px;border-radius:8px;background:#444;color:#fff;border:0;margin-left:6px}
.card .chk{display:flex;align-items:center;gap:8px;margin:10px 2px;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:60;pointer-events:none;opacity:0;transition:opacity .25s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>

<!-- ============ ΑΡΧΙΚΗ ============ -->
<div id="home">
  <div class="bgfx"></div>
  <div class="hwrap">
    <h1 class="brand">Archery Lab</h1>
    <div class="tech">Ανάλυση Τεχνικής</div>
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M4 19L15 5"/><path d="M11 19a7 7 0 0 0-2.4-5.2"/><path d="M17 9l4 2.5-4 2.5z" fill="currentColor"/></svg></div>
    <div class="cards">
      <button class="hcard pri" id="hCam"><span class="hi" data-ic="cam"></span><span class="ht"><b>Καταγραφή βίντεο</b><small>Ανοίγει την κάμερα · όρθια ή πλάγια · με zoom</small></span><span class="chev" data-ic="next"></span></button>
      <button class="hcard" id="hFile"><span class="hi" data-ic="folder"></span><span class="ht"><b>Άνοιγμα βίντεο</b><small>Αποθηκευμένα βίντεο ή αρχείο από τη συσκευή</small></span><span class="chev" data-ic="next"></span></button>
    </div>
    <ul class="chips">
      <li><i data-ic="angle"></i>Γωνίες &amp; γραμμές</li>
      <li><i data-ic="play"></i>Αργή κίνηση</li>
      <li><i data-ic="link"></i>Σύγκριση Α | Β</li>
      <li><i data-ic="save"></i>Αποθήκευση</li>
    </ul>
  </div>
</div>

<!-- ============ ΑΝΑΛΥΣΗ ============ -->
<div id="app" hidden>
  <button id="fsb" data-ic="fsx" aria-label="Έξοδος από πλήρη οθόνη"></button>
  <header class="top">
    <button class="ib backbtn" id="bBack" aria-label="Πίσω"><span data-ic="back"></span><span>Πίσω</span></button>
    <div class="title" id="ttl">Ανάλυση</div>
    <button class="ib" id="bLay" data-ic="cols" aria-label="Δίπλα δίπλα / Πάνω κάτω" hidden></button>
    <button class="ib" id="bFull" data-ic="full" aria-label="Πλήρης οθόνη"></button>
    <div class="abbtn" id="bAB" role="group" aria-label="Οθόνες A/B"><button data-p="A" aria-label="Οθόνη A">A</button><button data-p="B" aria-label="Οθόνη B">B</button></div>
    <button class="ib acc" id="bSave" data-ic="save" aria-label="Αποθήκευση"></button>
  </header>
  <div class="main">
    <div class="stagewrap">
      <div class="stage" id="stage"></div>
      <div class="tb" id="tb"></div>
      <div class="pop" id="pop" hidden>
        <div class="sws" id="sws"></div>
        <label>Πάχος γραμμής: <b id="vTh"></b></label>
        <input type="range" id="rTh" min="1" max="16" step="1">
        <label>Μέγεθος κειμένου / γωνίας: <b id="vFs"></b></label>
        <input type="range" id="rFs" min="10" max="70" step="1">
        <label>Καρέ ανά δευτερόλεπτο (για βηματισμό)</label>
        <select id="sFps"><option value="auto">Αυτόματο</option><option>24</option><option>25</option><option>30</option><option>50</option><option>60</option><option>120</option><option>240</option></select>
      </div>
    </div>
    <div class="dock" id="dock">
      <div class="dgrip" id="dgrip" aria-label="Αλλαγή ύψους μπάρας"><i></i></div>
      <div class="tl">
        <input type="range" id="slider" min="0" max="1000" value="0">
        <div class="tm"><span id="tTime">00:00.00</span><small id="tFrame">καρέ 0</small></div>
      </div>
      <div class="ruler" id="ruler"><canvas></canvas></div>
      <div class="ctl">
        <button class="cb spd" id="bSpd" aria-label="Ταχύτητα">1/1</button>
        <button class="cb" id="bPrev" data-ic="prev" aria-label="Προηγούμενο καρέ"></button>
        <button class="cb play" id="bPlay" data-ic="play" aria-label="Αναπαραγωγή"></button>
        <button class="cb" id="bNext" data-ic="next" aria-label="Επόμενο καρέ"></button>
        <button class="cb" id="bLoop" data-ic="loop" aria-label="Επανάληψη"></button>
        <button class="cb on" id="bSync" data-ic="link" aria-label="Συγχρονισμός A/B" hidden></button>
      </div>
    </div>
  </div>
</div>

<div id="modal" hidden><div class="card" id="card"></div></div>
<div id="toast"></div>
<input type="file" id="inCam" accept="video/*" capture="environment" hidden>
<input type="file" id="inFile" accept="video/*" hidden>

/* ---------- Γεωμετρία ---------- */
const rotP=(p,c,a)=>{const s=Math.sin(a),k=Math.cos(a),x=p.x-c.x,y=p.y-c.y;return{x:c.x+x*k-y*s,y:c.y+x*s+y*k}};
const centerOf=pts=>{let a=1e12,b=1e12,c=-1e12,d=-1e12;for(const p of pts){if(p.x<a)a=p.x;if(p.y<b)b=p.y;if(p.x>c)c=p.x;if(p.y>d)d=p.y}return{x:(a+c)/2,y:(b+d)/2}};
const radOf=(pts,c)=>{let m=0;for(const p of pts){const d=Math.hypot(p.x-c.x,p.y-c.y);if(d>m)m=d}return m};
const segDist=(p,a,b)=>{const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;let t=l?((p.x-a.x)*dx+(p.y-a.y)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)};
const l2w=(sh,x,y)=>{const s=Math.sin(sh.rot||0),k=Math.cos(sh.rot||0);return{x:sh.cx+x*k-y*s,y:sh.cy+x*s+y*k}};
const w2l=(sh,p)=>{const s=Math.sin(-(sh.rot||0)),k=Math.cos(-(sh.rot||0)),x=p.x-sh.cx,y=p.y-sh.cy;return{x:x*k-y*s,y:x*s+y*k}};
const isPts=sh=>!!sh.pts;
const shapeCenter=sh=>isPts(sh)?centerOf(sh.pts):{x:sh.cx,y:sh.cy};
function textBox(sh){mctx.font=`bold ${sh.size}px system-ui,sans-serif`;return{w:mctx.measureText(sh.text).width+sh.size*.5,h:sh.size*1.35}}
function snapAxis(a,b){const dx=b.x-a.x,dy=b.y-a.y,ang=Math.atan2(dy,dx),q=Math.PI/2,n=Math.round(ang/q)*q;if(Math.abs(ang-n)<.05){const l=Math.hypot(dx,dy);return{x:a.x+Math.cos(n)*l,y:a.y+Math.sin(n)*l}}return{x:b.x,y:b.y}}

/* ---------- Σχεδίαση σχημάτων ---------- */
function drawLabel(c,txt,x,y,size,color,rot){
 c.save();c.translate(x,y);if(rot)c.rotate(rot);c.font=`bold ${size}px system-ui,sans-serif`;c.textAlign='center';c.textBaseline='middle';
 c.lineJoin='round';c.lineWidth=size*.2;c.strokeStyle='rgba(0,0,0,.75)';c.strokeText(txt,0,0);c.fillStyle=color;c.fillText(txt,0,0);c.restore();
}
function drawShape(c,sh){
 c.save();c.strokeStyle=sh.color;c.fillStyle=sh.color;c.lineWidth=sh.lw;c.lineCap='round';c.lineJoin='round';
 const P=sh.pts;
 switch(sh.t){
  case 'line':c.beginPath();c.moveTo(P[0].x,P[0].y);c.lineTo(P[1].x,P[1].y);c.stroke();break;
  case 'arrow':{
   const a=P[0],b=P[1],d=Math.atan2(b.y-a.y,b.x-a.x),L=Math.hypot(b.x-a.x,b.y-a.y),hl=Math.min(sh.lw*5+8,L*.8);
   c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x-Math.cos(d)*hl*.7,b.y-Math.sin(d)*hl*.7);c.stroke();
   c.beginPath();c.moveTo(b.x,b.y);c.lineTo(b.x-hl*Math.cos(d-.42),b.y-hl*Math.sin(d-.42));c.lineTo(b.x-hl*Math.cos(d+.42),b.y-hl*Math.sin(d+.42));c.closePath();c.fill();break;}
  case 'angle':{
   const a=P[0],v=P[1],b=P[2];
   c.beginPath();c.moveTo(a.x,a.y);c.lineTo(v.x,v.y);c.lineTo(b.x,b.y);c.stroke();
   const ta=Math.atan2(a.y-v.y,a.x-v.x),tb=Math.atan2(b.y-v.y,b.x-v.x);let dl=tb-ta;
   while(dl>Math.PI)dl-=2*Math.PI;while(dl<-Math.PI)dl+=2*Math.PI;
   const minArm=Math.min(Math.hypot(a.x-v.x,a.y-v.y),Math.hypot(b.x-v.x,b.y-v.y));
   const r=Math.min(Math.max(minArm*.3,sh.fs*1.1),minArm*.9);
   c.lineWidth=sh.lw*.7;c.beginPath();c.arc(v.x,v.y,r,ta,ta+dl,dl<0);c.stroke();
   c.beginPath();c.arc(v.x,v.y,sh.lw*1.3,0,7);c.fill();
   const tm=ta+dl/2,lr=r+sh.fs*.95;
   drawLabel(c,Math.round(Math.abs(dl)*180/Math.PI)+'°',v.x+Math.cos(tm)*lr,v.y+Math.sin(tm)*lr,sh.fs,sh.color,0);break;}
  case 'free':
   c.beginPath();c.moveTo(P[0].x,P[0].y);
   if(P.length===1)c.lineTo(P[0].x+.01,P[0].y);
   for(let i=1;i<P.length;i++)c.lineTo(P[i].x,P[i].y);
   c.stroke();break;
  case 'rect':c.translate(sh.cx,sh.cy);c.rotate(sh.rot||0);c.strokeRect(-sh.w/2,-sh.h/2,sh.w,sh.h);break;
  case 'ellipse':c.translate(sh.cx,sh.cy);c.rotate(sh.rot||0);c.beginPath();c.ellipse(0,0,Math.max(1,sh.w/2),Math.max(1,sh.h/2),0,0,7);c.stroke();break;
  case 'text':drawLabel(c,sh.text,sh.cx,sh.cy,sh.size,sh.color,sh.rot||0);break;
 }
 c.restore();
}
function paintOverlays(c,p){
 if(S.grid){
  const m=Math.max(p.vw,p.vh),st=m/12;c.save();c.lineWidth=m/900*1.4;c.strokeStyle='rgba(255,255,255,.32)';c.beginPath();
  for(let x=0;x<=p.vw+1;x+=st){c.moveTo(x,0);c.lineTo(x,p.vh)}
  for(let y=0;y<=p.vh+1;y+=st){c.moveTo(0,y);c.lineTo(p.vw,y)}
  c.stroke();c.strokeStyle='rgba(255,255,255,.6)';c.beginPath();c.moveTo(p.vw/2,0);c.lineTo(p.vw/2,p.vh);c.moveTo(0,p.vh/2);c.lineTo(p.vw,p.vh/2);c.stroke();c.restore();
 }
 for(const sh of p.shapes)drawShape(c,sh);
}

/* ---------- Λαβές & hit-test ---------- */
function handlesOf(sh,s){
 const h=[],off=36/s;
 if(sh.t==='line'||sh.t==='arrow'||sh.t==='angle'){
  sh.pts.forEach((p,i)=>h.push({k:'pt',i,x:p.x,y:p.y}));
  const c=centerOf(sh.pts),R=radOf(sh.pts,c);h.push({k:'rot',x:c.x,y:c.y-R-off});
 }else if(sh.t==='free'){
  const c=centerOf(sh.pts),R=radOf(sh.pts,c)+12/s;h.push({k:'rot',x:c.x,y:c.y-R-off},{k:'scale',x:c.x+R,y:c.y});
 }else if(sh.t==='rect'||sh.t==='ellipse'){
  [[-1,-1],[1,-1],[1,1],[-1,1]].forEach((g,i)=>{const p=l2w(sh,g[0]*sh.w/2,g[1]*sh.h/2);h.push({k:'corner',i,sx:g[0],sy:g[1],x:p.x,y:p.y})});
  const p=l2w(sh,0,-sh.h/2-off);h.push({k:'rot',x:p.x,y:p.y});
 }else if(sh.t==='text'){
  const b=textBox(sh),p=l2w(sh,b.w/2,b.h/2),r=l2w(sh,0,-b.h/2-off);h.push({k:'scale',x:p.x,y:p.y},{k:'rot',x:r.x,y:r.y});
 }
 return h;
}
function hitShape(sh,w,s,isSel){
 const tol=Math.max(16/s,sh.lw/2+4/s);
 switch(sh.t){
  case 'line':case 'arrow':return segDist(w,sh.pts[0],sh.pts[1])<=tol;
  case 'angle':return segDist(w,sh.pts[0],sh.pts[1])<=tol||segDist(w,sh.pts[1],sh.pts[2])<=tol;
  case 'free':for(let i=1;i<sh.pts.length;i++)if(segDist(w,sh.pts[i-1],sh.pts[i])<=tol)return true;return sh.pts.length===1&&Math.hypot(w.x-sh.pts[0].x,w.y-sh.pts[0].y)<=tol;
  case 'rect':{const q=w2l(sh,w),dx=Math.abs(q.x)-sh.w/2,dy=Math.abs(q.y)-sh.h/2;const d=(dx>0||dy>0)?Math.hypot(Math.max(dx,0),Math.max(dy,0)):-Math.max(dx,dy);return isSel?d<=tol:Math.abs(d)<=tol}
  case 'ellipse':{const q=w2l(sh,w),a=sh.w/2||1,b=sh.h/2||1,r=Math.hypot(q.x/a,q.y/b),d=Math.abs(r-1)*Math.min(a,b);return isSel?(r<1||d<=tol):d<=tol}
  case 'text':{const b=textBox(sh),q=w2l(sh,w);return Math.abs(q.x)<=b.w/2+tol/2&&Math.abs(q.y)<=b.h/2+tol/2}
 }
 return false;
}

/* ---------- Ακριβές fps (π.χ. 29.97 / 59.94 αντί για 30 / 60) ---------- */
const KNOWN_FPS=[23.976,24,25,29.97,30,48,50,59.94,60,100,119.88,120,239.76,240];
function snapFps(x){let b=0,bd=1e9;for(const k of KNOWN_FPS){const d=Math.abs(x-k)/k;if(d<bd){bd=d;b=k}}return bd<.004?b:Math.round(x*100)/100}

/* Ανάγνωση mp4 (mp4box.js): δείγματα, ρυθμίσεις αποκωδικοποιητή, περιστροφή */
async function openMp4(file){
 if(!window.MP4Box)return null;
 const ab=await file.arrayBuffer();ab.fileStart=0;
 const mp=MP4Box.createFile();let info=null;
 mp.onReady=i=>{info=i};mp.onError=()=>{};
 mp.appendBuffer(ab);mp.flush();
 if(!info){await new Promise(r=>setTimeout(r,30));if(!info)return null}
 const tr=info.videoTracks&&info.videoTracks[0];if(!tr)return null;
 const trak=mp.getTrackById(tr.id),sm=trak&&trak.samples;
 if(!sm||sm.length<2||!sm[0].is_sync)return null;
 const mt=trak.tkhd&&trak.tkhd.matrix;let rot=0;
 if(mt){
  if(mt[0]===65536&&mt[4]===65536&&mt[1]===0&&mt[3]===0)rot=0;
  else if(mt[0]===0&&mt[4]===0&&mt[1]===65536&&mt[3]===-65536)rot=90;
  else if(mt[0]===-65536&&mt[4]===-65536&&mt[1]===0&&mt[3]===0)rot=180;
  else if(mt[0]===0&&mt[4]===0&&mt[1]===-65536&&mt[3]===65536)rot=270;
  else return null;
 }
 const entry=trak.mdia.minf.stbl.stsd.entries[0],bx=entry.avcC||entry.hvcC||entry.av1C;
 const cfg={codec:tr.codec,codedWidth:tr.video.width,codedHeight:tr.video.height};
 if(bx){if(!(bx.size>bx.hdr_size))return null;cfg.description=new Uint8Array(ab.slice(bx.start+bx.hdr_size,bx.start+bx.size))}
 return{ab,sm,cfg,tr,rot,tsc:sm[0].timescale||tr.timescale};
}

/* ---------- Cache καρέ: αποκωδικοποίηση με WebCodecs γύρω από τη θέση ----------
   Το <video>.currentTime είναι αργό (50-200ms ανά seek στο Android WebView). Εδώ το αρχείο
   διαβάζεται (mp4box.js), τα καρέ αποκωδικοποιούνται μπροστά/πίσω από τη θέση και κρατιούνται
   ως ImageBitmap, ώστε το jog να δείχνει καρέ άμεσα από τη μνήμη. Αν κάτι δεν υποστηρίζεται
   (κωδικοποιητής, περιστροφή, τεράστιο αρχείο) η εφαρμογή συνεχίζει με το <video> όπως πριν. */
class FrameCache{
 constructor(file){
  this.file=file;this.ok=false;this.dead=false;this.n=0;this.fps=30;this.w=0;this.h=0;
  this.map=new Map();this.win=new Set();this.order=[];this.cur=0;this.dir=1;this.max=40;
  this.running=false;this.errs=0;this.ver=0;this.fails=new Map();this.bad=new Set();this.d=null;this.pend=[];
  this.onframe=null;this.onfail=null;this.rs=undefined;
 }
 async init(){
  try{
   if(!(window.VideoDecoder&&window.EncodedVideoChunk&&window.createImageBitmap))return false;
   if(this.file.size>450*1048576)return false;
   const m=await openMp4(this.file);
   /* περιστροφή: το <video> την εφαρμόζει, ο VideoDecoder όχι → σε αυτή την περίπτωση χρήση <video> */
   if(!m||this.dead||m.rot!==0)return false;
   const ab=m.ab,sm=m.sm,tr=m.tr;
   const sup=await VideoDecoder.isConfigSupported(m.cfg);if(!sup||!sup.supported||this.dead)return false;
   const cfg=sup.config||m.cfg;
   const N=sm.length,tsc=m.tsc;
   const idx=Array.from({length:N},(_,i)=>i).sort((a,b)=>sm[a].cts-sm[b].cts);
   const c0=sm[idx[0]].cts;
   this.times=new Float64Array(N);this.pres=Int32Array.from(idx);this.tsU=new Float64Array(N);this.tsMap=new Map();
   for(let i=0;i<N;i++){const s=idx[i];this.times[i]=(sm[s].cts-c0)/tsc;this.tsU[s]=Math.round(sm[s].cts*1e6/tsc);this.tsMap.set(this.tsU[s],i)}
   if(this.tsMap.size!==N)return false;
   this.gs=new Int32Array(N);this.ge=new Int32Array(N);
   {let cur=0;for(let s=0;s<N;s++){if(s===0||sm[s].is_sync)cur=s;this.gs[s]=cur}
    let nxt=N;for(let s=N-1;s>=0;s--){if(s===0||sm[s].is_sync){this.ge[s]=nxt;nxt=s}}}
   const dif=[];for(let i=1;i<N;i++)dif.push(this.times[i]-this.times[i-1]);dif.sort((a,b)=>a-b);
   const med=dif[dif.length>>1]||1/30;
   this.fps=snapFps(Math.min(480,Math.max(5,1/med)));
   this.w=tr.video.width;this.h=tr.video.height;
   let bytes=this.w*this.h*4;const L=Math.max(this.w,this.h);
   if(L>1920){const k=1920/L;this.rs={resizeWidth:Math.round(this.w*k),resizeHeight:Math.round(this.h*k),resizeQuality:'medium'};bytes*=k*k}
   this.max=Math.max(10,Math.min(96,Math.floor(110e6/bytes)));
   this.ab=ab;this.sm=sm;this.cfg=cfg;this.n=N;this.ok=true;
   return true;
  }catch(e){return false}
 }
 indexAt(t){let lo=0,hi=this.n-1;t+=1e-4;while(lo<hi){const m=(lo+hi+1)>>1;if(this.times[m]<=t)lo=m;else hi=m-1}return lo}
 midT(i){const a=this.times[i],nx=i+1<this.n?this.times[i+1]:a+1/this.fps;return a+(nx-a)/2}
 get(i){const b=this.map.get(i);return b&&b.width>0?b:null}
 near(i,r){for(let d=1;d<=r;d++){let b=this.get(i-d);if(b)return b;b=this.get(i+d);if(b)return b}return null}
 /* Ζητά το καρέ i και γεμίζει το παράθυρο γύρω του (περισσότερα προς την κατεύθυνση κίνησης) */
 want(i,dir){
  if(!this.ok||this.dead)return;
  this.cur=i;if(dir)this.dir=dir>0?1:-1;
  const A=Math.ceil(this.max*.6),Bk=this.max-A-1,dr=this.dir,o=[i];
  for(let d=1;d<=A;d++){const a=i+dr*d;if(a>=0&&a<this.n)o.push(a);const b=i-dr*d;if(d<=Bk&&b>=0&&b<this.n)o.push(b)}
  this.order=o;this.win=new Set(o);this.ver++;
  for(const [k,b] of this.map){if(!this.win.has(k)){b.close();this.map.delete(k)}}
  this._run();
 }
 _missGops(){const out=[];for(const i of this.order){if(!this.map.has(i)&&!this.bad.has(i))out.push(this.gs[this.pres[i]])}return out}
 _next(){
  const miss=this._missGops();if(!miss.length)return null;
  const need=new Set(miss);let k0=miss[0],k1=this.ge[k0];
  while(k1<this.n&&k1-k0<24&&need.has(k1))k1=this.ge[k1];
  return[k0,k1];
 }
 _needs(k0,k1){for(const g of this._missGops()){if(g>=k0&&g<k1)return true}return false}
 async _run(){
  if(this.running||!this.ok||this.dead)return;this.running=true;
  try{
   for(let g=0;g<2000&&this.ok&&!this.dead;g++){
    const j=this._next();if(!j)break;
    const v0=this.ver,done=await this._job(j[0],j[1]);
    if(done&&v0===this.ver){
     for(const i of this.order){
      if(this.map.has(i)||this.bad.has(i))continue;const s=this.gs[this.pres[i]];
      if(s>=j[0]&&s<j[1]){const c=(this.fails.get(i)||0)+1;this.fails.set(i,c);if(c>=2)this.bad.add(i)}
     }
    }
   }
  }catch(e){this._err()}
  this.running=false;
  if(this.ok&&!this.dead&&this._next())this._run();
 }
 _dec(){
  let d=this.d;
  if(!d||d.state==='closed'){d=this.d=new VideoDecoder({output:fr=>this._out(fr),error:()=>{this.d=null;this._err()}})}
  if(d.state==='unconfigured')d.configure(this.cfg);
  return d;
 }
 async _job(k0,k1){
  const d=this._dec(),sm=this.sm;this.pend=[];let aborted=false;
  for(let s=k0;s<k1;s++){
   if(this.dead)return false;
   if(s>k0&&((s-k0)&7)===0&&!this._needs(k0,k1)){aborted=true;break}
   while(d.decodeQueueSize>10){
    await new Promise(r=>setTimeout(r,3));if(this.dead)return false;
    if(!this._needs(k0,k1)){aborted=true;break}
   }

  if(op.type==='pan')return;
  if(op.type==='text'){
   if(Math.hypot(pos.x-op.spos.x,pos.y-op.spos.y)>12)return;
   const t=await askText('');if(!t)return;
   const u=this.unit();this.shapes.push({t:'text',color:S.color,lw:S.thick*u,fs:S.fs*u,size:S.fs*u,text:t,cx:op.w.x,cy:op.w.y,rot:0});
   this.commit(op.snap);this.select(this.shapes.length-1);setTool('select');return;
  }
  if(op.type==='create'){
   const sh=op.sh,s=op.s,min=10/s;let ok=true;
   if(sh.t==='line'||sh.t==='arrow')ok=Math.hypot(sh.pts[1].x-sh.pts[0].x,sh.pts[1].y-sh.pts[0].y)>min;
   else if(sh.t==='angle')ok=Math.hypot(sh.pts[0].x-sh.pts[1].x,sh.pts[0].y-sh.pts[1].y)>min;
   else if(sh.t==='rect'||sh.t==='ellipse')ok=sh.w>min&&sh.h>min;
   else if(sh.t==='free')ok=sh.pts.length>=2;
   if(!ok){this.shapes.pop();this.dirty=true;return}
   if(sh.t==='free'&&sh.pts.length>400){const k=Math.ceil(sh.pts.length/400);sh.pts=sh.pts.filter((p,i)=>i%k===0||i===sh.pts.length-1)}
   this.commit(op.snap);this.select(this.shapes.length-1);setTool('select');return;
  }
  if(op.type==='move'&&!op.moved&&op.was&&this.shapes[this.sel]&&this.shapes[this.sel].t==='text'){
   const sh=this.shapes[this.sel],t=await askText(sh.text);if(t){sh.text=t;this.commit(op.snap)}return;
  }
  this.commit(op.snap);
 }
 deleteSel(){if(this.sel<0)return toast('Επίλεξε ένα σχήμα');const snap=JSON.stringify(this.shapes);this.shapes.splice(this.sel,1);this.sel=-1;this.commit(snap)}
 clearAll(){if(!this.shapes.length)return;const snap=JSON.stringify(this.shapes);this.shapes=[];this.sel=-1;this.commit(snap)}
}

/* ---------- Μπάρα που "περιστρέφεται" (ruler) ---------- */
const rulerEl=$('#ruler'),rulerCv=rulerEl.querySelector('canvas'),rctx=rulerCv.getContext('2d');
const TICK=8;                 /* px δαχτύλου ανά καρέ στην αργή κίνηση (πριν: 14) */
const JOG_MOMENTUM=true;      /* συνεχίζει να γυρίζει μετά από γρήγορο "πέταγμα" */
let rulerDrag=false,rulerF=0,rIdx=0,jX=0,jT=0,jV=0,jVS=0,jMom=0;
/* επιτάχυνση: αργά = 1 καρέ ανά TICK px (ακρίβεια), γρήγορα = έως 6 φορές περισσότερα καρέ */
const jogGain=s=>{const k=(s-.3)/1.7;return k<=0?1:1+5*Math.pow(Math.min(1,k),1.4)};
function sizeRuler(){const r=rulerEl.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2.5);rulerCv._d=d;rulerCv.width=Math.round(r.width*d);rulerCv.height=Math.round(r.height*d);drawRuler()}
function drawRuler(){
 const d=rulerCv._d||1,W=rulerCv.width/d,H=rulerCv.height/d;if(!W)return;const k=H/60;
 const p=active,has=p&&p.has,fps=has?p.fps:30,total=has?p.nFrames()-1:0;
 const f=rulerDrag?rulerF:(has?p.framePos():0);
 rctx.setTransform(d,0,0,d,0,0);rctx.clearRect(0,0,W,H);
 const cx=W/2,n0=Math.floor(f-cx/TICK)-1,n1=Math.ceil(f+cx/TICK)+1;
 rctx.textAlign='center';rctx.textBaseline='top';rctx.font=Math.round(11*Math.min(1.4,Math.max(.8,k)))+'px system-ui';
 for(let n=n0;n<=n1;n++){
  const x=cx+(n-f)*TICK,inr=n>=0&&n<=total,maj=n%10===0,mid=n%5===0;
  rctx.strokeStyle=inr?(maj?'#e8e8e8':mid?'#bdbdbd':'#777'):'#2c2c2c';rctx.lineWidth=maj?2:1.2;
  rctx.beginPath();rctx.moveTo(x,H);rctx.lineTo(x,H-(maj?26:mid?19:12)*k);rctx.stroke();
  if(maj&&inr){rctx.fillStyle='#9a9a9a';rctx.fillText(String(n),x,8*k)}
 }
 rctx.fillStyle='#ff3b30';rctx.fillRect(cx-1,0,2,H);
 rctx.beginPath();rctx.moveTo(cx-7,0);rctx.lineTo(cx+7,0);rctx.lineTo(cx,9);rctx.closePath();rctx.fill();
}
function jogApply(){
 const p=active;if(!p||!p.has)return;
 rulerF=clamp(rulerF,0,Math.max(0,p.nFrames()-1));
 const i=Math.round(rulerF);
 if(i!==rIdx){const df=i-rIdx;rIdx=i;stepFrames(df);if(Math.abs(df)===1){try{navigator.vibrate&&navigator.vibrate(3)}catch(_){}}}
 drawRuler();
}
const rulerEnd=()=>{if(jMom){cancelAnimationFrame(jMom);jMom=0}if(!rulerDrag)return;rulerDrag=false;lastUI='';updateTimeUI(true)};
function jogMomentum(v0){
 let vel=v0,last=performance.now();
 const step=now=>{
  const dt=Math.min(40,Math.max(1,now-last));last=now;
  rulerF+=vel*dt;vel*=Math.exp(-dt/260);
  const mx=Math.max(0,(active.nFrames()||1)-1);
  jogApply();
  if(Math.abs(vel)<.004||(rulerF<=0&&vel<0)||(rulerF>=mx&&vel>0)){jMom=0;rulerEnd();return}
  jMom=requestAnimationFrame(step);
 };
 jMom=requestAnimationFrame(step);
}
rulerEl.addEventListener('pointerdown',e=>{
 const p=active;if(!p||!p.has)return;
 if(jMom){cancelAnimationFrame(jMom);jMom=0}
 rulerDrag=true;rulerEl.setPointerCapture(e.pointerId);targets().forEach(q=>q.pauseNow());updatePlayIcon();
 rulerF=p.frameNo();rIdx=rulerF;jX=e.clientX;jT=e.timeStamp;jV=0;jVS=0;drawRuler();e.preventDefault();
});
rulerEl.addEventListener('pointermove',e=>{
 if(!rulerDrag||jMom)return;
 const dx=e.clientX-jX,dt=Math.max(1,e.timeStamp-jT);jX=e.clientX;jT=e.timeStamp;
 const a=1-Math.exp(-dt/35);
 jV+=(Math.abs(dx)/dt-jV)*a;
 const d=-dx/TICK*jogGain(jV);
 jVS+=(d/dt-jVS)*a;
 rulerF+=d;jogApply();
});
rulerEl.addEventListener('pointerup',e=>{
 if(!rulerDrag)return;
 if(JOG_MOMENTUM&&!jMom&&performance.now()-jT<70&&jV>.6&&Math.abs(jVS)>.02)jogMomentum(jVS);
 else rulerEnd();
});
rulerEl.addEventListener('pointercancel',rulerEnd);
new ResizeObserver(sizeRuler).observe(rulerEl);

/* Μετατροπή σε βελτιστοποιημένο mp4: ελεγχόμενα keyframes (κάθε 3 καρέ), ≤1280px, χωρίς ήχο */
async function optimizeVideo(file,onProg,ctl){
 if(!(window.VideoEncoder&&window.VideoFrame&&window.Mp4Muxer&&HTMLVideoElement.prototype.requestVideoFrameCallback))throw new Error('unsupported');
 const url=URL.createObjectURL(file),v=document.createElement('video');
 v.muted=true;v.playsInline=true;v.preload='auto';v.src=url;
 let enc=null;
 try{
  await new Promise((res,rej)=>{v.onloadedmetadata=res;v.onerror=()=>rej(new Error('load'));setTimeout(()=>rej(new Error('timeout')),15000)});
  const vw=v.videoWidth,vh=v.videoHeight,dur=v.duration;
  if(!vw||!vh||!isFinite(dur)||dur<=0)throw new Error('meta');
  const sc=Math.min(1,1280/Math.max(vw,vh)),W=Math.max(2,Math.round(vw*sc/2)*2),H=Math.max(2,Math.round(vh*sc/2)*2);
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const cx=cv.getContext('2d');
  const seek0=()=>new Promise(r=>{let d=false;const f=()=>{if(d)return;d=true;v.removeEventListener('seeked',f);r()};v.addEventListener('seeked',f);v.currentTime=0;setTimeout(f,1500)});
  /* 1) εκτίμηση fps */
  const diffs=[];
  await new Promise(res=>{let last=null,k=0;const t=setTimeout(res,3000);const cb=(n,m)=>{if(last!==null&&m.mediaTime>last)diffs.push(m.mediaTime-last);last=m.mediaTime;if(++k>=12){clearTimeout(t);res()}else v.requestVideoFrameCallback(cb)};v.requestVideoFrameCallback(cb);v.play().catch(res)});
  v.pause();await seek0();
  diffs.sort((a,b)=>a-b);const med=diffs.length?diffs[diffs.length>>1]:1/30;
  const fps=snapFps(Math.min(240,Math.max(10,1/med)));
  /* μικρογραφία */
  cx.drawImage(v,0,0,W,H);
  const tc=document.createElement('canvas');tc.width=320;tc.height=Math.round(320*H/W);tc.getContext('2d').drawImage(cv,0,0,tc.width,tc.height);
  const thumb=await new Promise(r=>tc.toBlob(r,'image/jpeg',.7));
  /* 2) επιλογή κωδικοποιητή */
  const bitrate=Math.round(Math.min(16e6,Math.max(2.5e6,W*H*fps*.18)));
  const mbr=Math.ceil(W/16)*Math.ceil(H/16)*fps;
  const lvl=mbr>245760?'33':'28';
  const cands=[{codec:'avc1.6400'+lvl,mux:'avc',extra:{avc:{format:'avc'}}},{codec:'avc1.4D00'+lvl,mux:'avc',extra:{avc:{format:'avc'}}},{codec:'vp09.00.40.08',mux:'vp9',extra:{}}];
  let cfg=null,mux=null;
  for(const c of cands){
   const conf={codec:c.codec,width:W,height:H,bitrate,framerate:fps,latencyMode:'quality',...c.extra};
   try{const r=await VideoEncoder.isConfigSupported(conf);if(r&&r.supported){cfg=r.config||conf;mux=c.mux;break}}catch(_){}
  }
  if(!cfg)throw new Error('nocodec');
  const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:mux,width:W,height:H},fastStart:'in-memory',firstTimestampBehavior:'offset'});
  let encErr=null;
  enc=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>{encErr=e}});
  enc.configure(cfg);
  /* 3) καταγραφή καρέ */
  const KEY=3;let n=0,lastTs=-1,lastAct=performance.now();
  await new Promise(res=>{
   let done=false;const fin=()=>{if(!done){done=true;clearInterval(wd);res()}};
   const wd=setInterval(()=>{if(ctl.cancel||encErr||performance.now()-lastAct>12000)fin()},300);
   v.addEventListener('ended',()=>setTimeout(fin,120),{once:true});
   const cb=async(now,m)=>{
    if(done)return;lastAct=performance.now();
    if(ctl.cancel||encErr){fin();return}
    const ts=Math.round(m.mediaTime*1e6);
    if(ts>lastTs){
     cx.drawImage(v,0,0,W,H);
     const fr=new VideoFrame(cv,{timestamp:ts});
     try{enc.encode(fr,{keyFrame:n%KEY===0})}catch(e){encErr=e}
     fr.close();n++;lastTs=ts;onProg(Math.min(1,m.mediaTime/dur));
     if(enc.encodeQueueSize>8){v.pause();while(enc.encodeQueueSize>2&&!ctl.cancel&&!encErr)await new Promise(r=>setTimeout(r,15));if(!ctl.cancel&&!v.ended)v.play().catch(()=>{})}
    }
    if(!done)v.requestVideoFrameCallback(cb);
   };
   v.requestVideoFrameCallback(cb);v.playbackRate=1;v.play().catch(fin);
  });
  v.pause();
  if(ctl.cancel){try{enc.close()}catch(_){}throw new Error('cancel')}
  if(encErr||n<2)throw encErr||new Error('frames');
  await enc.flush();enc.close();enc=null;muxer.finalize();
  const blob=new Blob([muxer.target.buffer],{type:'video/mp4'});
  return{blob,thumb,meta:{w:W,h:H,fps,duration:dur,codec:mux}};
 }finally{
  try{v.pause();v.removeAttribute('src');v.load()}catch(_){}
  URL.revokeObjectURL(url);try{enc&&enc.state!=='closed'&&enc.close()}catch(_){}

}

/* Μετατροπή χωρίς απώλεια καρέ: αποκωδικοποίηση ΟΛΩΝ των καρέ του αρχικού αρχείου (WebCodecs), όχι αναπαραγωγή σε πραγματικό χρόνο.
   Κρατά τους πραγματικούς χρόνους κάθε καρέ, εφαρμόζει την περιστροφή του κινητού και είναι συνήθως ταχύτερη από το βίντεο.
   Αν κάτι δεν υποστηρίζεται, η optimizeAuto πέφτει πίσω στην παλιά μέθοδο (optimizeVideo). */
async function optimizeVideoExact(file,onProg,ctl){
 if(!(window.VideoDecoder&&window.VideoEncoder&&window.VideoFrame&&window.EncodedVideoChunk&&window.Mp4Muxer))throw new Error('unsupported');
 const m=await openMp4(file);if(!m)throw new Error('demux');
 const sm=m.sm,N=sm.length,tsc=m.tsc,rot=m.rot;
 const sup=await VideoDecoder.isConfigSupported(m.cfg);if(!sup||!sup.supported)throw new Error('decoder');
 const idx=Array.from({length:N},(_,i)=>i).sort((a,b)=>sm[a].cts-sm[b].cts);
 const base=Math.round(sm[idx[0]].cts*1e6/tsc);
 const dif=[];for(let i=1;i<N;i++)dif.push(sm[idx[i]].cts-sm[idx[i-1]].cts);dif.sort((a,b)=>a-b);
 const med=(dif[dif.length>>1]||tsc/30)/tsc;
 const fps=snapFps(Math.min(240,Math.max(10,1/med)));
 const dur=(sm[idx[N-1]].cts-sm[idx[0]].cts)/tsc+med;
 const fw=m.cfg.codedWidth,fh=m.cfg.codedHeight;
 const sc=Math.min(1,1280/Math.max(fw,fh)),sw=Math.max(2,Math.round(fw*sc/2)*2),sh=Math.max(2,Math.round(fh*sc/2)*2);
 const sw2=rot===90||rot===270,W=sw2?sh:sw,H=sw2?sw:sh;
 const bitrate=Math.round(Math.min(16e6,Math.max(2.5e6,W*H*fps*.18)));
 const mbr=Math.ceil(W/16)*Math.ceil(H/16)*fps;
 const lvl=mbr>245760?'33':'28';
 const cands=[{codec:'avc1.6400'+lvl,mux:'avc',extra:{avc:{format:'avc'}}},{codec:'avc1.4D00'+lvl,mux:'avc',extra:{avc:{format:'avc'}}},{codec:'vp09.00.40.08',mux:'vp9',extra:{}}];
 let ecfg=null,mux=null;
 for(const c of cands){
  const conf={codec:c.codec,width:W,height:H,bitrate,framerate:fps,latencyMode:'quality',...c.extra};
  try{const r=await VideoEncoder.isConfigSupported(conf);if(r&&r.supported){ecfg=r.config||conf;mux=c.mux;break}}catch(_){}
 }
 if(!ecfg)throw new Error('nocodec');
 const cv=document.createElement('canvas');cv.width=W;cv.height=H;const cx=cv.getContext('2d');
 const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:mux,width:W,height:H},fastStart:'in-memory',firstTimestampBehavior:'offset'});
 const KEY=3,sleep=ms=>new Promise(r=>setTimeout(r,ms));
 let n=0,err=null,enc=null,dec=null;const tc=document.createElement('canvas');tc.width=320;tc.height=Math.max(2,Math.round(320*H/W));
 try{
  enc=new VideoEncoder({output:(c,mt)=>muxer.addVideoChunk(c,mt),error:e=>{err=e}});enc.configure(ecfg);
  dec=new VideoDecoder({
   output:fr=>{
    try{
     if(err)return;
     cx.save();
     if(rot){cx.translate(W/2,H/2);cx.rotate(rot*Math.PI/180);cx.drawImage(fr,-sw/2,-sh/2,sw,sh)}
     else cx.drawImage(fr,0,0,W,H);
     cx.restore();
     if(n===0)tc.getContext('2d').drawImage(cv,0,0,tc.width,tc.height);
     const vf=new VideoFrame(cv,{timestamp:fr.timestamp-base,duration:fr.duration||undefined});
     try{enc.encode(vf,{keyFrame:n%KEY===0})}finally{vf.close()}
     n++;
    }catch(e){err=e}
    finally{fr.close()}
   },
   error:e=>{err=e}
  });
  dec.configure(sup.config||m.cfg);
  for(let s=0;s<N;s++){
   if(ctl.cancel)throw new Error('cancel');
   if(err)throw err;
   let w=0;
   while(enc.encodeQueueSize>6||dec.decodeQueueSize>8){await sleep(2);if(ctl.cancel)throw new Error('cancel');if(err)throw err;if(++w>5000)throw new Error('stall')}
   const c=sm[s];
   dec.decode(new EncodedVideoChunk({type:c.is_sync?'key':'delta',timestamp:Math.round(c.cts*1e6/tsc),duration:Math.round(c.duration*1e6/c.timescale),data:new Uint8Array(m.ab,c.offset,c.size)}));
   if((s&15)===0){onProg(Math.min(.98,s/N));if((s&63)===0)await sleep(0)}
  }

  if(err)throw err;
  if(n!==N)throw new Error('frames');
  enc.close();enc=null;dec.close();dec=null;
  muxer.finalize();onProg(1);
  const thumb=await new Promise(r=>tc.toBlob(r,'image/jpeg',.7));
  return{blob:new Blob([muxer.target.buffer],{type:'video/mp4'}),thumb,meta:{w:W,h:H,fps,duration:dur,codec:mux,frames:n}};
 }finally{
  try{dec&&dec.state!=='closed'&&dec.close()}catch(_){}
  try{enc&&enc.state!=='closed'&&enc.close()}catch(_){}
 }
}
async function optimizeAuto(file,onProg,ctl){

}

 const stopped=new Promise(r=>{rec.onstop=r});rec.stop();await stopped;
 v.pause();v.loop=prev.loop;v.playbackRate=prev.rate;v.currentTime=prev.t;if(p.fc_ok){p.fi=p.fc.indexAt(prev.t);p.fc.want(p.fi,0);p.dirty=true}if(wl)try{wl.release()}catch(e){}
 closeModal();updatePlayIcon();
 if(cancelled)return;
 const type=(rec.mimeType||mime||'video/webm').split(';')[0];
 const blob=new Blob(chunks,{type});
 await saveBlob(blob,`${baseName(p)}-${p.name}-simeioseis-${stamp()}.${extOf(type)}`,share);
}
function openSave(){
 const loaded=panels.filter(p=>p.has&&vis(p));
 if(!loaded.length){toast('Δεν υπάρχει βίντεο');return}
 let src=loaded.includes(active)?active:loaded[0];
 const canShare=!!navigator.share&&!!navigator.canShare;
 const c=openModal(`<h3>Αποθήκευση</h3>
  ${loaded.length>1?`<div class="seg" id="sSrc"><button data-p="0">Βίντεο A</button><button data-p="1">Βίντεο B</button></div>`:''}
  <button class="mb" id="sOrig">Βίντεο χωρίς σημειώσεις<small>Το αρχικό αρχείο όπως είναι, χωρίς απώλεια ποιότητας</small></button>
  <button class="mb pri" id="sVid">Βίντεο με σημειώσεις<small>Εγγράφεται σε πραγματικό χρόνο — όση ώρα διαρκεί το βίντεο</small></button>
  <div style="font-size:14px;margin:-2px 4px 6px">Ταχύτητα εγγραφής: <select id="sRate"><option value="1">1/1 (κανονική)</option><option value="0.5">1/2</option><option value="0.25">1/4</option></select></div>
  <button class="mb" id="sImgN">Εικόνα καρέ με σημειώσεις (PNG)<small>Το τρέχον καρέ</small></button>
  <button class="mb" id="sImg0">Εικόνα καρέ χωρίς σημειώσεις (PNG)</button>
  ${loaded.length>1?`<button class="mb" id="sAB">Εικόνα σύγκρισης A+B με σημειώσεις (PNG)</button>`:''}
  ${canShare?`<label class="chk"><input type="checkbox" id="sShare"> Κοινοποίηση (WhatsApp, Drive…) αντί για λήψη</label>`:''}
  <button class="mb" id="sX" style="text-align:center">Κλείσιμο</button>`);
 const share=()=>!!(c.querySelector('#sShare')&&c.querySelector('#sShare').checked);
 const segs=c.querySelectorAll('#sSrc button');
 const paintSeg=()=>segs.forEach(b=>b.classList.toggle('on',panels[+b.dataset.p]===src));paintSeg();
 segs.forEach(b=>b.onclick=()=>{src=panels[+b.dataset.p];paintSeg()});
 c.querySelector('#sX').onclick=closeModal;
 c.querySelector('#sOrig').onclick=async()=>{const sh=share();closeModal();const f=src.file;await saveBlob(f,f.name||`athlete-${stamp()}.${extOf(f.type)}`,sh)};
 c.querySelector('#sVid').onclick=async()=>{const sh=share(),r=+c.querySelector('#sRate').value;closeModal();await exportVideo(src,r,sh)};
 c.querySelector('#sImgN').onclick=async()=>{const sh=share();closeModal();await saveImage(src,true,sh)};
 c.querySelector('#sImg0').onclick=async()=>{const sh=share();closeModal();await saveImage(src,false,sh)};
 const ab=c.querySelector('#sAB');if(ab)ab.onclick=async()=>{const sh=share();closeModal();await saveImageAB(sh)};
}
$('#bSave').onclick=openSave;
$('#modal').addEventListener('pointerdown',e=>{if(e.target.id==='modal'&&!$('#card').querySelector('.bar'))closeModal()});

/* ---------- Κύριος βρόχος ---------- */
function loop(){
 if(!$('#app').hidden){
  let playing=false;
  for(const p of panels){if(!p.has)continue;if(!p.video.paused||p.dirty){p.render();p.dirty=false}if(!p.video.paused)playing=true}
  updateTimeUI(false);
  if(playing&&performance.now()%7<1)updatePlayIcon();
 }
 requestAnimationFrame(loop);
}
fillIcons(document);buildToolbar();buildStyle();refreshLayout();A.el.classList.add('act');
requestAnimationFrame(loop);
window.addEventListener('resize',()=>panels.forEach(p=>p.resize()));
})();
</script>
